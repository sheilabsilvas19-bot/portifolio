        <center><i><h2>Contato</h2></i></center>
    <p>Preencha o formulário abaixo para entrar em contato.</p>

        <!--ACTION: DEFINE PARA ONDE OS DADOS DO FORMULARIO VAI SER ENVIADO  (Destino dos dados)-->
        <!--METHOD: DEFINE O FORMATO DO ENVIO -->

    <form action="#" method="POST">
    <fieldset> 
        <!--A tag <fieldset> serve para agrupar campos 
        relacionados dentro de um formulário, desenhando
        por padrão uma caixa (borda) ao redor deles. Ela
        organiza formulários longos em blocos lógicos e 
        melhora a acessibilidade para pessoas que usam leitores de tela.-->
<center>
        <legend>Dados para Contato</legend>
</center>
        <br><br>
        <div class="campo">
        <label for="nome">Nome Completo:</label>
        <input type="text" id="nome" name="nome" placeholder="Digite seu nome" required>
        </div>
<br>
        <div class="campo">
        <label for="email">E-mail:</label>
        <input type="email" id="email" name="email" placeholder="seuemail@exemplo.com" required>
        </div>
<br>
        <div class="campo">
        <label for="assunto">Assunto:</label>
        <select id="assunto" name="assunto" required>
        <option value="" disabled selected>Selecione um motivo</option>
        <option value="orcamento">Orçamento</option>
        <option value="oportunidade">Oportunidade de Trabalho</option>
        <option value="duvida">Dúvida Geral</option>
        </select>
        </div>
<br>
        <div class="campo">
        <label for="mensagem">Mensagem:</label>
        <textarea id="mensagem" name="mensagem" rows="4" placeholder="Escreva sua mensagem aqui..." required></textarea>
        </div>
<br>
        <div class="campo-checkbox">
        <input type="checkbox" id="termos" name="termos" required>
        <label for="termos">Concordo em compartilhar meus dados para retorno do contato.</label>
        </div>
<br>
        <button class="button" type="submit">Enviar Mensagem</button>
    </fieldset>
    </form>
